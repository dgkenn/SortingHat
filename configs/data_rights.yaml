# Data-rights ledger (Phase 0, commercial track). Owner: sortinghat/rights.py.
#
# Every dataset or model artefact the project may touch needs one entry here.
# An artefact missing from this file is refused for every purpose (fail closed).
#
# Use values (permitted_uses):
#   permitted      the licence or access grant, as recorded in evidence_file, allows the use
#   not_permitted  excluded by the licence, or no grant is held (no DUA, no agreement)
#   unknown        the licence text has not been read, or the sources conflict
#
# status is derived, and rights.py rejects any mismatch:
#   red     any use is not_permitted, or lineage is research_only
#   green   all five uses are permitted and open_questions is empty
#   yellow  everything else (an open question or an unknown use)
#
# lineage:
#   research_only        research terms only (DUA or NC licence); commercial uses are not_permitted
#   commercial_candidate may be cleared for commercial use, pending counsel and written terms
#   yellow               share-alike or conflicting licence statements; hold until clarified
#
# Commercial gates (see rights.PURPOSE_USES): an artefact counts as green for a commercial
# purpose only when its status is green and the required uses are permitted. Nothing is
# green yet: no counsel review has been recorded (DECISION_LOG D-072).
#
# Quoted facts come from the evidence_file named on each entry. Items marked "not read" were
# not checked against the primary licence text in this repo.

