# Imaging-anchored structural-injury label (imaging-E1) from BIND. Read by sortinghat/labels/bind.py.
# Pre-specified in docs/bind_e1_analysis_plan.md (D-158). Fixed BEFORE any BIND label is computed or counted.
#
# Provenance of each block:
#   columns / tables : CONFIRMED  (names-only header read of the BDSP credentialed access point, 2026-10-14).
#   concept classes  : the clinical definition is fixed by the plan. The regex strings that implement it were ADAPTED ONCE, in plan
#                      step 0c (2026-10-14), to the observed value vocabulary (values-only listing, no counts, no EEG linkage;
#                      DECISION_LOG D-160). Observed: Acute/Chronic in {acute, subacute, chronic, unknown}; Brain-related / Brain in
#                      {yes, no, unknown}; Nullfinding in {No, Yes, + two concatenated forms}; Label_LLAMA_Level1 = comma-separated
#                      overarching categories; Label_LLAMA_Level2 = a normalised finding name (far more distinct names than a short
#                      category list, acuity words stripped, negated findings such as "no infarct" present). No further change is allowed after D-160.
#   window           : fixed by the plan (calendar days, because the imaging date is date-only; see the plan).

schema_version: 1
status: VOCAB_OBSERVED_0C        # CONFIRMED columns; value vocabularies observed in plan step 0c (D-160); regexes adapted once, then frozen

prefix: "Imaging/{site}/Clinical/"             # site-level tables only; never open Imaging/<site>/BIDS or Non-BIDS patient folders
sites: [I0001, I0004]                          # I0001 = MGB (EEG-linked); I0004 = Stanford (PSG-linked, not in the EEG cohort)
tables:                                        # CONFIRMED file names
  findings: "{site}_imaging_findings_De-id.csv"
  reports: "{site}_reports.csv"
  demographics: "{site}_demographics.csv"

# canonical name -> real header name (CONFIRMED). The findings header is identical at I0001 and I0004.
findings_columns:
  person: BDSPPatientID
  session: Session_id
  dob: ShiftedDateOfBirth
  study_date: ShiftedStudyDate
  counts: Counts
  abnormality: Abnormality
  brain: Brain
  finding_id: FindingID
  present_prior: PresentPrior
  change: Change
  name: Name
  general_name: "General Name"
  location: Location
  brain_related: "Brain-related"
  magnitude: Magnitude
  acuity: "Acute/Chronic"
  test: Test
  label_manual: Label_manual
  nullfinding: Nullfinding
  level2: Label_LLAMA_Level2
  level1: Label_LLAMA_Level1
# demographics: header differs by site; only the session catalogue (person, session, study date) and DOB are used.
demographics_columns:
  I0001: {person: bdsp_patient_id, session: Session_id, dob: ShiftedDateOfBirth, study_date: ShiftedStudyDate}
  I0004: {person: bdsp_patient_id, session: Session_id, dob: ShiftedDateOfBirth, study_date: ShiftedStudyDate}
reports_columns: {person: bdsp_patient_id, session: session_id, type: Type}
# Free text. NEVER loaded into memory by the loader and never read by an agent (CLAUDE.md rules 1, 3, 4).
never_load: [Report_txt]

# ---- value vocabularies (ASSUMED until step 0c) -------------------------------------------------------------------
truthy: ["yes", "y", "true", "1", "t"]
falsy: ["no", "n", "false", "0", "f"]
acute_regex: "\\b(acute|subacute|sub-acute|hyperacute|early subacute|new)\\b"
chronic_regex: "\\b(chronic|remote|old|sequela|sequelae|prior|stable|late subacute)\\b"   # checked FIRST; a chronic qualifier wins
# columns whose text is searched for the lesion concepts
match_columns: [name, general_name, level2]

# ---- window (calendar days, imaging date minus t0 date) -----------------------------------------------------------
window_days: [-1, 3]              # primary; ~[-24 h, +72 h] with day resolution. Sensitivities are in the plan, not here.

# ---- lesion classes (primary imaging-E1 = any of `primary_classes`; mirrors the silver imaging items, configs/silver_anchors.yaml) ----
primary_classes: [infarct, ich, sah, sdh_edh, tbi_contusion, mass_effect]
secondary_classes: [hydrocephalus]
classes:
  # Level2 is a normalised finding name with the acuity words removed ("sub infarct" = subacute infarct); acuity comes from the
  # Acute/Chronic column. Small-vessel / chronic-microangiopathy wording, global hypoxic-ischaemic injury (label E2, not E1),
  # spinal and optic ischaemia are not "infarct" in the plan's definition.
  infarct:
    include: "infarct|ischemi|ischaemi|stroke|\\bcva\\b|restricted diffusion|diffusion restriction|diffusion abnormal"
    # lacunar / small-vessel / microvascular wording excludes only when the text does not itself say "infarct" (an acute lacunar
    # infarct is an acute infarct; "small vessel ischemic change" is chronic microangiopathy)
    exclude: "^(?!.*infarct).*(lacun|microvascular|micro-vascular|small[- ]vessel|microangiopath|periventricular|leukoencephalopath|white matter)|leukoaraiosis|gliosis|encephalomalacia|chronic|sequela|\\bremote\\b|\\bold\\b|hypox|anox|spinal cord|optic|ischemic (change|changes|disease|foci|focus)\\b"
  # Level2 usually says only "hemorrhage" / "hematoma": an unspecified acute intracranial haemorrhage counts as ICH; the named
  # compartments below are separate classes, so they are excluded here to keep the per-class flags apart.
  ich:
    include: "h(a)?emorrhag|h(a)?ematoma|intracerebral|intracranial bleed|\\bich\\b"
    exclude: "microh(a)?emorrhag|microbleed|micro-h(a)?emorrhag|cavernous|cavernoma|hemosiderin|chronic|\\bold\\b|\\bremote\\b|subarachnoid|subdural|epidural|extradural|extra-axial|subgaleal|scalp|intraventricular|spinal"
  sah:
    include: "subarachnoid (h(a)?emorrhag|blood|h(a)?ematoma|bleed|clot)|\\bsah\\b|(h(a)?emorrhag|blood).{0,40}subarachnoid"
    exclude: "chronic|\\bold\\b|hemosiderin|superficial siderosis|\\bremote\\b"
  sdh_edh:
    include: "subdural|epidural|extradural|extra-axial (h(a)?emorrhag|h(a)?ematoma|blood)|\\bsdh\\b|\\bedh\\b"
    exclude: "chronic|hygroma|effusion|empyema|abscess|cyst|\\bold\\b|\\bremote\\b"
  tbi_contusion:
    include: "contusion|diffuse axonal|axonal injury|\\bdai\\b|\\btraumatic (brain|axonal|injur|contusion|h(a)?emorrhag|h(a)?ematoma)|\\btbi\\b|\\btrauma\\b"
    exclude: "chronic|encephalomalacia|gliosis|\\bremote\\b|post-?traumatic|non-?traumatic|atraumatic|scalp|subgaleal"
  mass_effect:
    include: "midline shift|herniation|mass effect|effacement of (the )?(basal cisterns|cisterns|sulci|subarachnoid spaces|ventricles?)|\\bedema\\b|\\boedema\\b"
    exclude: "no mass effect|without mass effect|chronic|gliosis|papilledema|spinal cord|optic|orbital|scalp|soft tissue|mucosal"
  hydrocephalus:
    include: "hydrocephalus|ventriculomegaly|ventricular enlargement"
    exclude: "ex vacuo|chronic|stable|shunt(ed)?|normal pressure|\\bnph\\b|ventriculostomy"
# a negated mention is not a finding (the extractor is asked for explicit findings only, but check anyway)
negation_regex: "\\b(no|without|negative for|absence of|absent|ruled out)\\b"

# ---- assessability ------------------------------------------------------------------------------------------------
# A session is a BRAIN study (assessable) when it has >= 1 findings row with Brain-related (or Brain) true, or its report
# Type matches `report_type_regex`.
# Step 0c (D-160): the report Type column is NOT used (null). Observed: nearly every study of a typed MRI-brain report has a findings row,
# i.e. a normal or non-contributory brain study leaves rows (Nullfinding / NORMAL category / non-qualifying findings), it is not absent;
# the untyped ("not available") reports are not a brain-study catalogue and many have no rows. Counting a study with no findings row as a
# brain study would turn extraction failures and non-brain studies into assessable negatives.
session_assessable:
  from_findings_brain: true
  report_type_regex: null
# A lesion-class match whose acuity is blank/unknown is INDETERMINATE (masked), never negative and never positive.
indeterminate_masks_label: true
