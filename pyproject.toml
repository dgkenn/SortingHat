[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sortinghat"
version = "0.0.1"
description = "SortingHat: Phase 0 agent-safety and HEEDB field-audit tooling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3", "pyyaml>=6"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
# Optional: only used to cross-check the built-in EDF reader (tests skip without it). The pipeline needs no EDF library.
eeg = ["pyedflib>=0.1.36"]
rungs = ["torch>=2.4", "torchvision", "timm>=1.0", "einops>=0.8"]   # CPU builds; install torchvision from the matching CPU index
dev = ["pytest>=8", "pyarrow>=14"]

[tool.setuptools.packages.find]
include = ["sortinghat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
